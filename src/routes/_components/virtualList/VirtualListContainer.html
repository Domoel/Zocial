<slot></slot>
<script>
  import { virtualListStore } from './virtualListStore.js'
  import { throttle } from '../../_thirdparty/lodash/timers.js'
  import { isFullscreen, attachFullscreenListener, detachFullscreenListener } from '../../_utils/fullscreen.js'
  import { mark, stop } from '../../_utils/marks.js'
  import { doubleRAF } from '../../_utils/doubleRAF.js'
  import { observe } from 'svelte-extras'
  import {
    addScrollListener,
    removeScrollListener,
    getScrollContainer,
    getOffsetHeight
  } from '../../_utils/scrollContainer.js'
  import { registerResizeListener, unregisterResizeListener } from '../../_utils/resize.js'

  const SCROLL_EVENT_DELAY = 300

  export default {
    oncreate () {
      mark('onCreate VirtualListContainer')
      const {
        realm
      } = this.get()
      this.store.setCurrentRealm(realm)
      this.setupScroll()
      this.setupFullscreen()
      this.onResize = this.onResize.bind(this)
      const { scrollTop } = this.store.get()
      const scrollContainer = getScrollContainer()
      // Measure the viewport (offsetHeight) at mount in ALL cases. Previously this only ran in the
      // scrollTop===0 branch below (and on window-resize), so opening a timeline with a saved scroll
      // position — or any cold list whose slow fetch resolves after mount — could leave offsetHeight
      // at its realm default of 0. With offsetHeight 0 the render buffer collapses (4 * 0) and the
      // visible-items window shrinks to ~the first item, so the list looked unloaded until a manual
      // scroll/resize forced a re-measure. Measuring here makes the first render use the real height.
      this.onResize()
      if (scrollTop > 0) {
        this.observe('allVisibleItemsHaveHeight', allVisibleItemsHaveHeight => {
          const { initializedScrollTop } = this.get()
          if (!initializedScrollTop && allVisibleItemsHaveHeight) {
            this.set({ initializedScrollTop: true })
            requestAnimationFrame(() => {
              mark('set scrollTop')
              scrollContainer.scrollTop = scrollTop
              stop('set scrollTop')
              doubleRAF(() => {
                this.fire('initialized')
              })
            })
          }
        })
      } else {
        this.fire('noNeedToScroll')
        this.observe('allVisibleItemsHaveHeight', allVisibleItemsHaveHeight => {
          if (allVisibleItemsHaveHeight) {
            this.fire('initialized')
          }
        })
      }
      registerResizeListener(this.onResize)
      // A cold list/timeline (no cache to prefill) mounts empty and only receives its items once the
      // slow fetch resolves. The viewport/scroll metrics measured above ran against the empty layout,
      // and nothing re-measures them when content lands later — which can leave the visible-items
      // window wrong until a manual scroll/resize. Re-measure once when items first appear so the list
      // renders without needing a scroll. (doubleRAF: wait for the items to lay out first.)
      let measuredWithContent = false
      this.observe('length', length => {
        if (length > 0 && !measuredWithContent) {
          measuredWithContent = true
          doubleRAF(() => {
            if (this._destroyed) {
              return
            }
            // Re-read the viewport height and the scroll position from the now-populated DOM and
            // push them into the store, so the visible-items window recomputes against real metrics
            // (this is what a manual scroll/resize was doing to "unstick" the list).
            this.onResize()
            this.onScroll()
          })
        }
      })
      stop('onCreate VirtualListContainer')
    },
    ondestroy () {
      this._destroyed = true
      this.teardownScroll()
      this.teardownFullscreen()
      this.store.setCurrentRealm(null)
      unregisterResizeListener(this.onResize)
    },
    store: () => virtualListStore,
    methods: {
      observe,
      setupScroll () {
        this.scrollListener = throttle(event => {
          const { fullscreen } = this.get()
          if (fullscreen) {
            return
          }
          this.onScroll()
        }, SCROLL_EVENT_DELAY, {
          leading: true,
          trailing: true
        })
        addScrollListener(this.scrollListener)
      },
      teardownScroll () {
        removeScrollListener(this.scrollListener)
        // Cancel any pending trailing invocation so it can't fire after
        // ondestroy() has reset currentRealm to null (which would write
        // scrollTop/scrollHeight into a stale/null realm).
        this.scrollListener.cancel()
      },
      setupFullscreen () {
        this.onFullscreenChange = this.onFullscreenChange.bind(this)
        attachFullscreenListener(this.onFullscreenChange)
      },
      teardownFullscreen () {
        detachFullscreenListener(this.onFullscreenChange)
      },
      onScroll () {
        const { scrollTop, scrollHeight } = getScrollContainer()

        doubleRAF(() => {
          mark('onScroll -> setForRealm()')
          this.store.setForRealm({ scrollTop, scrollHeight })
          stop('onScroll -> setForRealm()')
        })
      },
      onFullscreenChange () {
        mark('onFullscreenChange')
        this.set({ fullscreen: isFullscreen() })
        stop('onFullscreenChange')
      },
      onResize () {
        this.store.setForRealm({
          scrollHeight: getScrollContainer().scrollHeight,
          offsetHeight: getOffsetHeight()
        })
      }
    },
    computed: {
      // TODO: bug in svelte/store – the observer in oncreate() never get removed without this hack
      allVisibleItemsHaveHeight: ({ $allVisibleItemsHaveHeight }) => $allVisibleItemsHaveHeight,
      length: ({ $length }) => $length
    }
  }
</script>
