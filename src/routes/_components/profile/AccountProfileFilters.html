<TabSet
  label="{'intl.filters'}"
  currentTabName={filter}
  {tabs}
  className="account-profile-filters"
/>
<script>
  import TabSet from '../TabSet.html'
  import { store } from '../../_store/store.js'

  export default {
    store: () => store,
    computed: {
      // Resolve via $messages so the tab labels follow the live UI language. Reuse `statuses`
      // ("Posts") and `media`; postsAndReplies is the only new key.
      tabs: ({ account, $messages }) => (
        [
          {
            name: '',
            label: $messages.statuses,
            href: `/accounts/${account.id}`
          },
          {
            name: 'with_replies',
            label: $messages.postsAndReplies,
            href: `/accounts/${account.id}/with_replies`
          },
          {
            name: 'media',
            label: $messages.media,
            href: `/accounts/${account.id}/media`
          }
        ]
      )
    },
    components: {
      TabSet
    }
  }
</script>
