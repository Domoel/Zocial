<GenericConfirmationDialog
  {id}
  {label}
  title="{'intl.createList'}"
  positiveText="{'intl.createList'}"
  {confirmationButtonDisabled}
  on:positive="onCreate()">
  <div class="create-list-dialog">
    <label class="create-list-label" for="create-list-title">
      {'intl.listTitle'}
    </label>
    <input
      type="text"
      id="create-list-title"
      class="create-list-input"
      ref:titleInput
      autocomplete="off"
      on:input="onInput(event)"
    />
    {#if exclusiveSupported}
      <label class="create-list-exclusive">
        <input
          type="checkbox"
          checked={exclusive}
          on:change="onExclusiveChange(event)"
        />
        <span class="create-list-exclusive-text">
          <span class="create-list-exclusive-label">{'intl.listExclusive'}</span>
          <span class="create-list-exclusive-help">{'intl.listExclusiveHelp'}</span>
        </span>
      </label>
    {/if}
  </div>
</GenericConfirmationDialog>
<style>
  .create-list-dialog {
    display: flex;
    flex-direction: column;
    padding: 20px 20px 10px;
    gap: 8px;
  }
  .create-list-label {
    font-size: 1.1em;
  }
  .create-list-input {
    font-size: 1.1em;
    padding: 6px 8px;
    border: 1px solid var(--settings-list-item-border);
    background: var(--input-bg);
    color: var(--body-text-color);
    border-radius: 2px;
  }
  .create-list-exclusive {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 6px;
    cursor: pointer;
  }
  .create-list-exclusive input {
    margin-top: 3px;
  }
  .create-list-exclusive-text {
    display: flex;
    flex-direction: column;
  }
  .create-list-exclusive-label {
    font-size: 1em;
  }
  .create-list-exclusive-help {
    font-size: 0.85em;
    color: var(--deemphasized-text-color);
  }
</style>
<script>
  import GenericConfirmationDialog from './GenericConfirmationDialog.html'
  import { store } from '../../../_store/store.js'
  import { show } from '../helpers/showDialog.js'
  import { close } from '../helpers/closeDialog.js'
  import { createNewList } from '../../../_actions/lists.js'
  import { toast } from '../../../_components/toast/toast.js'
  import { formatIntl } from '../../../_utils/formatIntl.js'

  export default {
    oncreate () {
      requestAnimationFrame(() => {
        if (this.refs.titleInput) {
          this.refs.titleInput.focus()
        }
      })
    },
    store: () => store,
    data: () => ({
      title: '',
      exclusive: false
    }),
    computed: {
      confirmationButtonDisabled: ({ title }) => !title.trim(),
      // Show the checkbox unless support is confirmed false (null/unknown → optimistic). A backend
      // that doesn't support it surfaces via the read-back toast in onCreate, after which the flag
      // is false and the checkbox hides.
      exclusiveSupported: ({ $listsExclusiveSupported }) => $listsExclusiveSupported !== false
    },
    methods: {
      show,
      close,
      onInput (e) {
        this.set({ title: e.target.value })
      },
      onExclusiveChange (e) {
        this.set({ exclusive: e.target.checked })
      },
      async onCreate () {
        const { title, exclusive } = this.get()
        if (!title.trim()) return
        try {
          const created = await createNewList(title.trim(), exclusive)
          // The backend silently ignores `exclusive` if it doesn't support it: we asked for it but
          // it didn't come back true. Tell the user (the list is still created, just not exclusive).
          if (exclusive && !(created && created.exclusive)) {
            /* no await */ toast.say('intl.listExclusiveNotSupported')
          }
          this.close()
        } catch (e) {
          // The GenericConfirmationDialog already closed itself on the positive click
          // (it fires 'positive' on destroy), so we can't keep it open here. Surface the
          // failure via a toast instead of letting it become an unhandled rejection.
          console.error('failed to create list', e)
          /* no await */ toast.say(formatIntl('intl.unableToCreateList', { error: (e.message || '') }))
        }
      }
    },
    components: {
      GenericConfirmationDialog
    }
  }
</script>
