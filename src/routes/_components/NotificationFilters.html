<TabSet
  label="{'intl.filters'}"
  currentTabName={filter}
  {tabs}
  className="notification-filters"
/>
<script>
  import TabSet from './TabSet.html'
  import { store } from '../_store/store.js'

  export default {
    store: () => store,
    computed: {
      // Resolve via the reactive $messages map so the tab labels follow a live language switch.
      tabs: ({ $messages }) => ([
        {
          name: '',
          label: $messages.all,
          href: '/notifications'
        },
        {
          name: 'mentions',
          label: $messages.mentions,
          href: '/notifications/mentions'
        }
      ])
    },
    components: {
      TabSet
    }
  }
</script>
