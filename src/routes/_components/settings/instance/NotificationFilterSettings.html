<GenericInstanceSettings
  {instanceName}
  {options}
  label="{'intl.notificationFilterSettings'}"
/>
<script>
  import GenericInstanceSettings from './GenericInstanceSettings.html'
  import {
    NOTIFICATION_REBLOGS,
    NOTIFICATION_FAVORITES,
    NOTIFICATION_FOLLOWS,
    NOTIFICATION_MENTIONS,
    NOTIFICATION_POLLS,
    NOTIFICATION_SUBSCRIPTIONS
  } from '../../../_static/instanceSettings.js'
  import { store } from '../../../_store/store.js'

  export default {
    store: () => store,
    computed: {
      // Resolve via the reactive $messages map so the labels follow a live language switch.
      options: ({ $messages }) => ([
        {
          key: NOTIFICATION_FOLLOWS,
          label: $messages.newFollowers,
          defaultValue: true
        },
        {
          key: NOTIFICATION_FAVORITES,
          label: $messages.favorites,
          defaultValue: true
        },
        {
          key: NOTIFICATION_REBLOGS,
          label: $messages.reblogs,
          defaultValue: true
        },
        {
          key: NOTIFICATION_MENTIONS,
          label: $messages.mentions,
          defaultValue: true
        },
        {
          key: NOTIFICATION_POLLS,
          label: $messages.pollResults,
          defaultValue: true
        },
        {
          key: NOTIFICATION_SUBSCRIPTIONS,
          label: $messages.subscriptions,
          defaultValue: true
        }
      ])
    },
    components: {
      GenericInstanceSettings
    }
  }
</script>
