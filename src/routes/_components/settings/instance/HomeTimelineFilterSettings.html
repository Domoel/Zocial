<GenericInstanceSettings
  {instanceName}
  {options}
  label="{'intl.homeTimelineFilterSettings'}"
/>
<script>
  import GenericInstanceSettings from './GenericInstanceSettings.html'
  import { HOME_REBLOGS, HOME_REPLIES } from '../../../_static/instanceSettings.js'
  import { store } from '../../../_store/store.js'

  export default {
    store: () => store,
    computed: {
      // Resolve via the reactive $messages map so the labels follow a live language switch.
      options: ({ $messages }) => ([
        {
          key: HOME_REBLOGS,
          label: $messages.showReblogs,
          defaultValue: true
        },
        {
          key: HOME_REPLIES,
          label: $messages.showReplies,
          defaultValue: true
        }
      ])
    },
    components: {
      GenericInstanceSettings
    }
  }
</script>
