<nav class="settings-nav" {style}>
  <ul>
    {#each navItems as navItem}
    <li>
      <SettingsNavItem {page} name={navItem.name} href={navItem.href} label={navItem.label} />
    </li>
    {/each}
    <li>
      <SettingsNavItem {page} name={page} href="/{page}" {label} />
    </li>
  </ul>
</nav>

<style>
  .settings-nav ul {
    margin: 20px 20px;
    padding: 0;
    list-style: none;
  }

  .settings-nav li {
    margin: 5px 0;
    font-size: 1em;
    display: inline-block;
  }

  .settings-nav li::after {
    content: '>';
    margin: 0 15px;
    color: var(--anchor-text);
  }

  .settings-nav li:last-child::after {
    content: '';
    margin-inline-start: 0;
    font-size: 1em;
  }

</style>
<script>
  import SettingsNavItem from './SettingsNavItem.html'
  import { store } from '../../_store/store.js'

  export default {
    components: {
      SettingsNavItem
    },
    store: () => store,
    computed: {
      // Resolve via the reactive $messages map (not bare 'intl.x', which the loader turns into a
      // getMessage call that wouldn't re-run on a language switch) so the breadcrumb crumbs follow
      // the live UI language.
      navItemLabels: ({ $isUserLoggedIn, $messages }) => ({
        settings: $messages.settings,
        'settings/about': $messages.aboutApp,
        'settings/general': $messages.general,
        'settings/instances': $messages.instances,
        'settings/instances/add': $isUserLoggedIn ? $messages.addInstance : $messages.logIn
      }),
      navItems: ({ page, navItemLabels }) => {
        const res = []
        const breadcrumbs = page.split('/')
        let path = ''
        for (let i = 0; i < breadcrumbs.length - 1; i++) {
          const currentPage = breadcrumbs[i]
          path += currentPage
          res.push({
            label: navItemLabels[path],
            href: `/${path}`,
            name: path
          })
          path += '/'
        }
        return res
      }
    },
    data: () => ({
      style: ZOCIAL_IS_BROWSER ? '' : 'opacity: 0'
    })
  }
</script>
