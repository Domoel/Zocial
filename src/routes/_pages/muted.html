<DynamicPageBanner title="{'intl.mutedUsers'}" icon="#fa-volume-off" />
{#if $isUserLoggedIn }
  <AccountsListPage {accountsFetcher} {accountActions} />
{/if}
<script>
  import AccountsListPage from '../_components/AccountsListPage.html'
  import { store } from '../_store/store.js'
  import { getMutedAccounts } from '../_api/blockedAndMuted.js'
  import DynamicPageBanner from '../_components/DynamicPageBanner.html'
  import { setAccountMuted } from '../_actions/mute.js'

  export default {
    computed: {
      // accountActions is a computed (not data) so the button label follows a live language switch.
      accountActions: ({ $messages }) => ([
        {
          icon: '#fa-volume-up',
          label: $messages.unmute,
          onclick: (accountId) => setAccountMuted(accountId,
            /* mute */ false,
            /* notifications */ false,
            /* toastOnSuccess */ true)
        }
      ]),
      accountsFetcher: ({ $currentInstance, $accessToken }) => (maxId) => getMutedAccounts($currentInstance, $accessToken, maxId)
    },
    store: () => store,
    components: {
      AccountsListPage,
      DynamicPageBanner
    }
  }
</script>
