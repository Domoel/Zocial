<DynamicPageBanner title="{'intl.blockedUsers'}" icon="#fa-ban" />
{#if $isUserLoggedIn }
  <AccountsListPage {accountsFetcher} {accountActions} />
{/if}
<script>
  import AccountsListPage from '../_components/AccountsListPage.html'
  import { store } from '../_store/store.js'
  import { getBlockedAccounts } from '../_api/blockedAndMuted.js'
  import DynamicPageBanner from '../_components/DynamicPageBanner.html'
  import { setAccountBlocked } from '../_actions/block.js'

  export default {
    computed: {
      // accountActions is a computed (not data) so the button label follows a live language switch.
      accountActions: ({ $messages }) => ([
        {
          icon: '#fa-unlock',
          label: $messages.unblock,
          onclick: (accountId) => setAccountBlocked(accountId, false, true)
        }
      ]),
      accountsFetcher: ({ $currentInstance, $accessToken }) => (maxId) => getBlockedAccounts($currentInstance, $accessToken, maxId)
    },
    store: () => store,
    components: {
      AccountsListPage,
      DynamicPageBanner
    }
  }
</script>
