<Title name={pageTitle} />

<LazyPage pageComponent={parsedPage.component} params={parsedPage.params} />

<script>
  import Title from '../_components/Title.html'
  import LazyPage from '../_components/LazyPage.html'
  import statusPageComponent from '../_pages/statuses/index.html'
  import favoritesPageComponent from '../_pages/statuses/favorites.html'
  import reblogsPageComponent from '../_pages/statuses/reblogs.html'
  import reactionsPageComponent from '../_pages/statuses/reactions.html'
  import Error from '../_error.html'

  export default {
    components: {
      LazyPage,
      Title
    },
    computed: {
      // parsedPage is keyed only on `params` (not $messages) so a language switch never rebuilds it
      // — which would remount the page component. It stores the title as a bare i18n KEY; the
      // separate pageTitle computed resolves it via the reactive $messages map.
      parsedPage: ({ params }) => {
        const { statusParams } = params
        const statusId = statusParams[0]
        if (statusParams.length === 1) {
          return {
            component: statusPageComponent,
            params: {
              statusId
            },
            titleKey: 'status'
          }
        } if (statusParams.length === 2 && !statusParams[1].includes('.')) {
          const page = statusParams[1]
          if (page === 'favorites') {
            return {
              component: favoritesPageComponent,
              params: {
                statusId
              },
              titleKey: 'favorites'
            }
          }
          if (page === 'reactions') {
            return {
              component: reactionsPageComponent,
              params: {
                statusId
              },
              titleKey: 'reactions'
            }
          }
          if (page === 'reblogs') {
            return {
              component: reblogsPageComponent,
              params: {
                statusId
              },
              titleKey: 'reblogs'
            }
          }
        } else {
          return {
            component: statusPageComponent,
            params: {
              statusId,
              fallbackUrl: 'https://' + statusParams.slice(1).map(e => encodeURI(e)).join('/')
            },
            titleKey: 'status'
          }
        }
        return {
          component: Error,
          params: {
            status: 404,
            message: 'Not found'
          }
        }
      },
      pageTitle: ({ parsedPage, $messages }) => parsedPage.titleKey ? $messages[parsedPage.titleKey] : ''
    }
  }
</script>
