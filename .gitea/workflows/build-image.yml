# BACKUP ONLY — the regular pipeline is docker.yml (Gitea container registry + Watchtower).
# Manually builds the image and pushes it to Docker Hub (domoel/zocial), e.g. if the Gitea registry
# is unavailable. Needs the repository secrets DOCKER_USERNAME / DOCKER_PASSWORD.
name: Docker Hub image (backup)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - dev

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Generate timestamp
        run: echo "TAG=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Set image tag
        run: |
          if [ "${{ inputs.branch }}" = "dev" ]; then
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Set release channel
        run: |
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "CHANNEL=prod" >> $GITHUB_ENV
          else
            echo "CHANNEL=dev" >> $GITHUB_ENV
          fi

      # Secrets via env, not interpolated into the script text: `${{ secrets… }}` in `run:` is
      # substituted before the shell runs, so the runner would write it in plain text to a temp file.
      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | docker login \
            -u "$DOCKER_USERNAME" \
            --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg ZOCIAL_CHANNEL=${CHANNEL} \
            -t domoel/zocial:${IMAGE_TAG} \
            -t domoel/zocial:${IMAGE_TAG}-${TAG} \
            .

      - name: Push image
        run: |
          docker push domoel/zocial:${IMAGE_TAG}
          docker push domoel/zocial:${IMAGE_TAG}-${TAG}
