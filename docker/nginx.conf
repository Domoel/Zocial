server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Use Docker's embedded DNS resolver so nginx resolves the translation
  # backend hostname per-request rather than at startup. This prevents the
  # container from crashing when TRANSLATE_API points to an unreachable host.
  resolver 127.0.0.11 valid=30s;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers. nginx drops server-level add_header in any location that sets its own, so
  # every such location below repeats them. frame-ancestors can't be set from the page's <meta> CSP.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Webpack output carries a content hash in its file name: safe to cache forever.
  location ^~ /client/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Everything else keeps its name across deploys: the shell (service-worker-index.html), the
  # service worker, config.js (runtime env), theme CSS, the manifest, the emoji data. Revalidate on
  # every use (cheap with ETag) — "immutable" here pinned browsers to an old build and hid runtime
  # config changes for up to 30 days, and the service worker precaches through the HTTP cache.
  location ~* \.(js|css|html|json|webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Unhashed images and fonts rarely change; a day is a fine trade-off.
  location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location /api/translate {
    set $translate_backend "__TRANSLATE_API__";
    proxy_pass $translate_backend/translate;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/detect {
    set $translate_backend "__TRANSLATE_API__";
    proxy_pass $translate_backend/detect;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/languages {
    set $translate_backend "__TRANSLATE_API__";
    proxy_pass $translate_backend/languages;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
